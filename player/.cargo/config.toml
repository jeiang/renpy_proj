# Every Cargo command in the workspace links the static CPython that crates/pyhost/build.rs builds into
# build-out/cpython. The config file is committed (not generated) because pyo3-ffi's build script reads it
# before any other build script can write it. It has no link lines; crates/pyhost/build.rs emits them.
[env]
PYO3_CONFIG_FILE = { value = "crates/pyhost/pyo3-config.txt", relative = true }

# Windows: static CRT for the whole graph (research/win-spike section 5.1). One /MD static library in the
# link would break it. FFmpeg is the exception by design: it is a set of DLLs with a C interface.
# The search path lets crates that use pyo3 without pyhost (their test binaries) find the empty pythonXY.lib that
# pyo3-ffi names on Windows. Cargo runs rustc from the workspace root, so the relative path is stable.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-L", "native=build-out/cpython/lib",
]
