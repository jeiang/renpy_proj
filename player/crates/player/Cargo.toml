[package]
name = "player"
description = "The player binary: runs a Ren'Py 7/8 game from its game/ folder."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["wayland"]
wayland = ["platform/wayland"]

[dependencies]
pyhost = { workspace = true }
engine = { workspace = true }
surface = { workspace = true }
platform = { workspace = true }
gfx = { workspace = true }
media = { workspace = true }
anyhow = { workspace = true }
library = { path = "../library" }
saves = { path = "../saves" }
vfs = { path = "../vfs" }
patches = { path = "../patches" }
serde_json = "1"
text = { path = "../text" }
py2fix = { path = "../py2fix" }
