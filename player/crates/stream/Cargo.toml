[package]
name = "stream"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
encode = { path = "../encode" }
str0m = { version = "0.24", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"

# Crypto backend. apple-crypto needs Xcode's Swift toolchain, which cannot build inside the Nix
# shell (SDK/compiler mismatch, the static library is not produced); aws-lc-rs builds on macOS and Linux.
[target.'cfg(not(target_os = "windows"))'.dependencies]
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
[target.'cfg(target_os = "windows")'.dependencies]
str0m = { version = "0.24", default-features = false, features = ["wincrypto"] }
