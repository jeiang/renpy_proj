[package]
name = "library"
description = "Game library: scanning, library.toml, pre-flight status and the egui window."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# RAR extraction (UnRAR by Alexander Roshal: freeware licence, extraction only; see THIRD_PARTY.md).
rar = ["dep:unrar"]

[dependencies]
anyhow = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha1 = "0.10"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }
rfd = "0.17"
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", default-features = false }
bzip2 = "0.6"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["deflate", "bzip2"] }
unrar = { version = "0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["deflate", "compress", "util"] }
egui_kittest = { version = "0.36.2", default-features = false }
