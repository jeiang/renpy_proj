[package]
name = "platform"
description = "Window, events and input: renpy.pygame.display/event/key/mouse/time/..."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# `--no-default-features` on the player builds an X11-only binary (winit without its Wayland backend).
default = ["wayland"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]

[dependencies]
pyo3 = { workspace = true }
pyo3-ffi = { workspace = true }
winit = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
arboard = { version = "3", default-features = false }
log = { workspace = true }
gilrs = { workspace = true }
