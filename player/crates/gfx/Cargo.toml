[package]
name = "gfx"
description = "wgpu draw backend (WgpuDraw), GLSL translator, textures, YUV video upload."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pyo3 = { workspace = true }
wgpu = { workspace = true, features = ["naga-ir"] }
naga = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
surface = { workspace = true }
platform = { workspace = true }
media = { workspace = true }
png = "0.18"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
