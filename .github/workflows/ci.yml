# Continuous integration: format, licence notices, fast unit tests and checked release builds on macOS arm64
# and Linux (manylinux_2_28), then the synthetic integration corpus in three Linux shards.
# The gate on real games stays manual (docs/LOCAL-FILES.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch or pull request cancels the run it supersedes. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Fast unit tests (no player build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: player
          key: unit-dev
      - run: python3 -m unittest discover -s harness/tests -t harness/tests
      - run: python3.12 -m unittest discover -s player/engine/python/tests
      - run: cargo test -p library
        working-directory: player
      - run: cargo test -p py2fix --no-default-features
        working-directory: player

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
        working-directory: player

  notices:
    name: Licence notices are current
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Regenerate RUST_DEPENDENCIES.md and compare
        run: |
          (cd player && cargo fetch --locked)
          player/packaging/licences/generate.sh
          git diff --exit-code -- player/packaging/licences/RUST_DEPENDENCIES.md

  build:
    name: Build (${{ github.event_name }})
    uses: ./.github/workflows/build.yml
    with:
      checks: true

  synth:
    name: Synthetic corpus (${{ matrix.shard }}, Xvfb + lavapipe)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            build-games: aniso story media
            games: SynthAniso,SynthStory,SynthMedia
          - shard: 2
            build-games: text view obf
            games: SynthText,SynthView,SynthObf
          - shard: 3
            build-games: big py7 py7patch
            games: SynthBig,Synth7,Synth7Patch
    env:
      HARNESS_DISPLAY: xvfb
      # The media generator only makes test files. Nothing links it and nothing ships it, so the runner's apt ffmpeg
      # (GPL build) is allowed here. The packages never contain it.
      SYNTH_ALLOW_GPL: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Restore stock baselines
        id: baseline
        uses: actions/cache/restore@v6
        with:
          path: harness/out/synth-baseline
          # fetch.sh pins SDK 8.5.3 and 7.4.11; it is also hashed by testgames/**.
          key: synth-baseline-v1-ubuntu24-sdk8.5.3-7.4.11-${{ matrix.shard }}-${{ hashFiles('harness/testgames/**', 'harness/gatelib/**', 'harness/rpy/**', 'harness/gate.py', 'harness/corpus.toml', 'harness/plans/**', '.github/workflows/ci.yml') }}
      - name: Install the display and Mesa packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 git procps util-linux ca-certificates \
            xvfb xkb-data x11-xkb-utils xdotool x11-utils x11-apps \
            mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libasound2t64 libdrm2 libudev1 libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxcursor1 libxrandr2 libxi6 \
            libxinerama1 libxss1 libpulse0 ffmpeg
      - uses: actions/cache@v6
        with:
          path: |
            research/test-corpus/sdk
            harness/testgames/fonts
          key: synth-sdk-${{ hashFiles('harness/testgames/fetch.sh') }}
      - run: harness/testgames/fetch.sh
      - uses: actions/download-artifact@v8
        with:
          name: package-linux
          path: ${{ runner.temp }}/package
      - name: Unpack the player
        run: tar -xzf "$RUNNER_TEMP/package/urp-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/package"
      # SynthUHD is manual; py7ai and py7trust are not run by CI.
      - name: Build this shard's synthetic games
        env:
          GAMES: ${{ matrix.build-games }}
        run: python3 harness/testgames/build.py $GAMES
      - name: Run stock on a baseline cache miss
        if: steps.baseline.outputs.cache-hit != 'true'
        env:
          GAMES: ${{ matrix.games }}
        run: |
          python3 harness/testgames/run.py --no-build --stock-only \
            --games "$GAMES" --out harness/out/synth-baseline \
            --gate-args "--diff-mean 0.01 --diff-pct 1.0"
      - name: Save successful stock baselines
        if: steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: harness/out/synth-baseline
          key: ${{ steps.baseline.outputs.cache-primary-key }}
      - name: Run the player against cached stock
        env:
          GAMES: ${{ matrix.games }}
        run: |
          python3 harness/testgames/run.py --no-build --player-only \
            --games "$GAMES" --baseline-root harness/out/synth-baseline \
            --player-bin "$RUNNER_TEMP/package/urp-linux-x86_64/urp" \
            --gate-args "--diff-mean 0.01 --diff-pct 1.0"
      - name: Keep the gate results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: synth-results-${{ matrix.shard }}
          path: |
            harness/out/synth
            harness/out/synth-baseline
          retention-days: 7
