# garret client config for GitHub Actions. The client mints its own OIDC token there;
# the schema still requires the [oidc] table, whose issuer/client_id go unused on that path.
endpoint = "https://cache-push.jeiang.dev"
puller_endpoint = "https://cache.jeiang.dev"

[oidc]
issuer = "https://token.actions.githubusercontent.com"
client_id = "github-actions"
# Must match the `audience` on the github-actions issuer in cornn-flaek's
# modules/garret/default.nix.
audience = "https://cache-push.jeiang.dev/"
